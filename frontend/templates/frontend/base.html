{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}
            Personal Knowledge AI
        {% endblock %}
    </title>


    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Highlight.js theme -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.12.0/styles/github-dark.min.css"
    >


    <!-- Application CSS -->
    <link
        rel="stylesheet"
        href="{% static 'frontend/css/app.css' %}"
    >

</head>


<body>

    {% block content %}
    {% endblock %}


    <!-- Bootstrap -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- Markdown parser -->
    <script
        src="https://cdn.jsdelivr.net/npm/marked@18.0.12/lib/marked.umd.js">
    </script>


    <!-- HTML sanitizer -->
    <script
        src="https://cdn.jsdelivr.net/npm/dompurify@3.4.15/dist/purify.min.js">
    </script>


    <!-- Syntax highlighting -->
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.12.0/highlight.min.js">
    </script>


    <!-- Page-specific JavaScript -->
    {% block scripts %}
    {% endblock %}

</body>

</html>
