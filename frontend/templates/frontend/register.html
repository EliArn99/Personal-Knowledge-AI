{% extends "frontend/base.html" %}
{% load static %}

{% block title %}
Register | Personal Knowledge AI
{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <h1 class="mb-2">
            Create account
        </h1>

        <p class="text-secondary mb-4">
            Start using Personal Knowledge AI
        </p>

        <div
            id="error-message"
            class="alert alert-danger d-none">
        </div>

        <form id="register-form">

            {% csrf_token %}

            <div class="mb-3">

                <label
                    for="username"
                    class="form-label">
                    Username
                </label>

                <input
                    id="username"
                    class="form-control"
                    required
                >

            </div>

            <div class="mb-3">

                <label
                    for="email"
                    class="form-label">
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    class="form-control"
                    required
                >

            </div>

            <div class="mb-3">

                <label
                    for="password"
                    class="form-label">
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    class="form-control"
                    required
                >

            </div>

            <div class="mb-4">

                <label
                    for="password-confirm"
                    class="form-label">
                    Confirm password
                </label>

                <input
                    id="password-confirm"
                    type="password"
                    class="form-control"
                    required
                >

            </div>

            <button
                type="submit"
                class="btn btn-dark w-100">
                Register
            </button>

        </form>

        <p class="text-center mt-4">

            Already have an account?

            <a href="/login/">
                Login
            </a>

        </p>

    </div>

</div>

{% endblock %}


{% block scripts %}

<script
    src="{% static 'frontend/js/register.js' %}">
</script>

{% endblock %}
